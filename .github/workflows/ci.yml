name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Java
        # actions/setup-java@v5.2.0
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Clojure
        # DeLaGuardo/setup-clojure@13.6.1
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d
        with:
          cli: latest
          zprint: latest
          clj-kondo: latest

      - name: Install tagref
        run: |
          TAGREF_VERSION=1.12.1
          curl -LSfs -o /usr/local/bin/tagref \
            "https://github.com/stepchowfun/tagref/releases/download/v$TAGREF_VERSION/tagref-x86_64-unknown-linux-gnu"
          chmod +x /usr/local/bin/tagref
          tagref --version

      - name: Run formatter
        run: make format

      - name: Ensure formatting clean
        run: |
          if ! git diff --exit-code; then
            echo "::error::Formatting changes detected after 'make format'. Please run 'make format' and commit the changes."
            git --no-pager diff
            exit 1
          fi

      - name: Run checks
        run: |
          if ! make check; then
            echo "::error::'make check' failed. Please run it locally and resolve the reported issues."
            exit 1
          fi

      - name: Run tests
        run: |
          if ! make test; then
            echo "::error::'make test' failed. Please run it locally and resolve the reported issues."
            exit 1
          fi
