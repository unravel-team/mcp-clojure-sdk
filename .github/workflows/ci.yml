name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest
          zprint: latest

      - name: Install tagref
        run: |
          TAGREF_VERSION=1.12.1
          curl -LSfs -o /usr/local/bin/tagref \
            "https://github.com/stepchowfun/tagref/releases/download/v$TAGREF_VERSION/tagref-x86_64-unknown-linux-gnu"
          chmod +x /usr/local/bin/tagref
          tagref --version

      - name: Run formatter
        run: make format

      - name: Ensure formatting clean
        run: |
          if ! git diff --exit-code; then
            echo "::error::Formatting changes detected after 'make format'. Please run 'make format' and commit the changes."
            git --no-pager diff
            exit 1
          fi

      - name: Run checks
        run: |
          if ! make check; then
            echo "::error::'make check' failed. Please run it locally and resolve the reported issues."
            exit 1
          fi

      - name: Run tests
        run: |
          if ! make test; then
            echo "::error::'make test' failed. Please run it locally and resolve the reported issues."
            exit 1
          fi
